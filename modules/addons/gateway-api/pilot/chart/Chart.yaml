apiVersion: v2
name: gateway-api-pilot
description: >
  Gateway API 실제 서비스 오브젝트(Gateway/HTTPRoute/LoadBalancerConfiguration/
  TargetGroupConfiguration) — release/prod 두 환경 각각에 대해 이 모듈을 for_each로
  인스턴스화해서 쓴다(02_k8s-addon/main.tf 참고). module.alb_controller "다음"에 있어야 한다
  (그 컨트롤러 자신의 Helm 차트가 LoadBalancerConfiguration/TargetGroupConfiguration CRD를
  제공하기 때문 — modules/addons/gateway-api-crds/main.tf 주석 참고).

  Faro(alloy-faro) 관련 ReferenceGrant/TargetGroupConfiguration은 release/prod가 같은
  Service를 공유해서 여기 안 두고 modules/addons/gateway-api-faro에 별도로 뒀다(env별로 중복
  생성하면 같은 namespace/name 오브젝트를 두 helm_release가 동시에 소유하려다 충돌함).
version: 0.2.0
