# 2026-08-21: ArgoCD 컴포넌트 전부에 최소 CPU/메모리 requests를 부여 — 기본 차트 값(전부 {})은
# QoS class가 BestEffort가 돼서, 노드 CPU가 바빠지면 커널 스케줄러가 이 파드들을 제일 먼저
# 밀어냄. 2026-08-18 만 명 부하테스트 때 이 문제로 argocd-repo-server가 liveness probe
# 타임아웃으로 3번 강제 재시작당하고 그 시간대에 ArgoCD UI 자체가 connection refused로 안
# 열렸던 사고가 실제로 있었음(CLAUDE_LLM_WIKI troubleshooting/loadtest-10000-open-run-cascading-failures
# 참고, "재발 방지" 2번 항목). requests만으로도 QoS가 Burstable로 올라가서 이 문제가 해소됨 —
# limits는 비정상 상황에서 이 컨트롤 플레인 컴포넌트가 앱 파드 자원까지 잠식하지 않게 상한만 걸어둠.

controller:
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

repoServer:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

server:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }

applicationSet:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

dex:
  resources:
    requests: { cpu: 30m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }

redis:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

notifications:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
