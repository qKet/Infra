# ArgoCD 알림용 Gmail 자격증명을 ESO로 동기화 — 03_registry에 저장해둔 시크릿을
# 같은 root(02_k8s-addon)의 module.eso_controller(공유 컨트롤러)가 읽어와서, argocd
# 네임스페이스에 "argocd-notifications-secret"이라는 이름의 K8s Secret을 자동으로 만들어준다.
# 이름을 기존과 똑같이 맞춰서 notifications-controller 쪽은 코드 변경 없음.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: argocd
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.awsRegion | quote }}
