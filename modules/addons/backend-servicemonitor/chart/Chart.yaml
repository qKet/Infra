apiVersion: v2
name: backend-servicemonitor
description: >
  backend Prometheus 스크랩 설정(ServiceMonitor)을 helm_release로 설치하는 로컬 차트.
  CRD는 여기서 vendoring하지 않는다 — module.monitoring(kube-prometheus-stack)이 자기 crds/
  폴더로 이미 설치해준다. kubernetes_manifest 대신 helm_release를 쓰는 이유는
  CLAUDE_LLM_WIKI decisions/2026-08-20-ingress-to-gateway-api-migration과 동일 — plan 단계에서
  CRD 스키마를 확인하는 kubernetes_manifest와 달리, helm_release는 이 문제 자체가 없다.
version: 0.1.0
