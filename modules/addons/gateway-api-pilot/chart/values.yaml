# modules/addons/gateway-api-crds가 만드는 GatewayClass 이름 — 여긴 그걸 참조만 함.
gatewayClassName: alb

# 실제 값은 전부 Terraform(main.tf)의 helm_release set 블록에서 env별로 주입한다.
# 여기 값은 `helm lint`/`helm template`를 값 없이 돌려도 되게 하는 자리 표시자일 뿐.
pilot:
  enabled: true
  env: release
  namespace: qket-release
  hostname: dev.jun979.click
  certificateArn: ""
  loadBalancerName: team5-qket-gw-release-alb

  backend:
    serviceName: qket-backend-service
    servicePort: 80
    healthCheckPort: "8081"
    healthCheckPath: /actuator/health

  frontend:
    serviceName: qket-frontend-service
    servicePort: 80
    healthCheckPath: /healthz

  # Grafana Alloy Faro 수집 엔드포인트(브라우저 SDK) — HTTPRoute 라우팅 규칙에만 필요, 이 backendRef가
  # 실제로 허용되려면 modules/addons/gateway-api-faro가 만드는 ReferenceGrant가 먼저 있어야 함.
  faro:
    serviceName: alloy-faro
    namespace: monitoring
    servicePort: 12347

  tags:
    Team: team5
    Project: qket
