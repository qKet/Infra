apiVersion: v2
name: gateway-api-crds
description: >
  Gateway API core CRD(kubernetes-sigs/gateway-api v1.6.1, standard channel: GatewayClass/
  Gateway/HTTPRoute 등)를 vendoring해서, 그걸 쓰는 GatewayClass/Gateway/HTTPRoute 실제
  오브젝트와 "같은 차트, 같은 helm_release" 안에 묶어둔 로컬 차트.

  AWS 전용 CRD(LoadBalancerConfiguration/TargetGroupConfiguration/ListenerRuleConfiguration)는
  여기서 따로 vendoring하지 않는다 — modules/addons/alb-controller가 설치하는 공식
  aws-load-balancer-controller Helm 차트가 자기 crds/ 폴더에 이미 포함해서 설치해주기 때문
  (중복 vendoring하면 두 차트가 서로 다른 버전을 밀어넣는 flip-flop 위험만 생김). 이 모듈이
  module.alb_controller에 depends_on을 거는 이유가 여기 있음 — 처리해줄 컨트롤러가 필요해서이기도
  하지만, 우리 templates/의 LoadBalancerConfiguration·TargetGroupConfiguration이 쓰는 CRD 자체를
  그쪽이 제공하기 때문이기도 하다.

  CRD는 crds/ 폴더 컨벤션으로 templates/보다 항상 먼저 설치되는 것이 Helm 자체가 보장하는 동작이라,
  이 차트를 통째로 하나의 helm_release로 설치하면 "CRD가 plan/apply 시점에 아직 없어서 실패하는"
  문제(kubernetes_manifest/kubectl_manifest가 겪는 문제, CLAUDE_LLM_WIKI의
  troubleshooting/crd-not-yet-installed-on-fresh-apply 참고)가 원천적으로 발생하지 않는다.

  core CRD는 IAM 정책(main 브랜치 추종)과 달리 의도적으로 특정 버전에 고정(vendoring) — 스키마가
  하루아침에 바뀌는 게 IAM 권한 하나 느는 것보다 훨씬 위험한 실패 모드라서.
version: 0.1.1
