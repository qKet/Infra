# =========================================================
# 이 파일은 더 이상 "복사해서 값 채우는 템플릿"이 아닙니다.
#
# db-secrets / redis-secrets / storage-config(S3_BUCKET, CLOUDFRONT_DOMAIN) /
# app-config(DB_PORT, DB_NAME, REDIS_PORT, AWS_REGION) / aws-secrets(불필요해짐) —
# 전부 Terraform이 직접 관리합니다:
#   - db-secrets, redis-secrets   → module.eso_release (External Secrets Operator가
#                                    Secrets Manager에서 자동 동기화)
#   - storage-config, 백엔드 S3 접근 → module.storage_release (IRSA라 aws-secrets 자체가 불필요)
#   - app-config                  → 루트 app-config.tf (Terraform이 RDS/ElastiCache
#                                    만들 때 이미 아는 값이라 사람이 따로 입력할 필요 없음)
#
# 즉 `terraform apply` 한 번이면 이 값들이 다 갖춰지고, kubectl로 따로 만들 것이 없습니다.
# 자세한 내용은 docs/infra/README.html 참고.
# =========================================================
